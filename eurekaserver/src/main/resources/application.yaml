spring:
  application:
    name: eureka-server

server:
  port: ${PORT:8761}

eureka:
  client:
    # Serveur autonome : il ne s'enregistre pas aupres de lui-meme et ne va
    # chercher aucun registre ailleurs. Ce n'est pas un oubli, c'est la config
    # normale d'un Eureka standalone -- ne pas passer ces deux-la a true en
    # croyant "activer" quelque chose.
    register-with-eureka: false
    fetch-registry: false

  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}

  server:
    # Reglages taille dev : on veut voir un service apparaitre et disparaitre
    # tout de suite apres un docker compose up/restart, pas au bout d'une minute
    # et demie. En production, remettre l'auto-preservation et des intervalles
    # plus larges -- ces valeurs generent beaucoup de trafic de controle.
    wait-time-in-ms-when-sync-empty: 0
    response-cache-update-interval-ms: 5000
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 10000

logging:
  level:
    # Volontairement pas a OFF : c'est ici qu'on lit "Registered instance
    # TRIP-SERVICE/..." quand on cherche pourquoi un service n'apparait pas.
    "[com.netflix.eureka]": INFO
    "[com.netflix.discovery]": WARN
