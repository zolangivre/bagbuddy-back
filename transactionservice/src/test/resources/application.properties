# Test-only overrides: an in-memory DB and a static auth config so the Spring context
# can start without Postgres or Keycloak being up.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

bagbuddy.auth.issuer-uris=http://localhost:8000/realms/bagbuddy,http://keycloak:8080/realms/bagbuddy
bagbuddy.auth.jwk-set-uri=http://localhost:8000/realms/bagbuddy/protocol/openid-connect/certs
bagbuddy.auth.audience=bagbuddy-api

spring.security.oauth2.client.registration.bagbuddy-service.provider=keycloak
spring.security.oauth2.client.registration.bagbuddy-service.client-id=bagbuddy
spring.security.oauth2.client.registration.bagbuddy-service.client-secret=dummy-for-context-load
spring.security.oauth2.client.registration.bagbuddy-service.authorization-grant-type=client_credentials
spring.security.oauth2.client.provider.keycloak.token-uri=http://localhost:8000/realms/bagbuddy/protocol/openid-connect/token
bagbuddy.service-client.registration-id=bagbuddy-service
bagbuddy.trip-service.url=http://localhost:8082
