spring:
  application:
    name: trip-service

  # --- GraphQL ---
  # Le point d'entree porte le prefixe du service : l'apigateway continue de router par prefixe
  # de chemin (Path=/trips/**) sans reecriture, et un appel direct au conteneur emprunte
  # exactement la meme URL. Une seule route, un seul POST : c'est le contrat GraphQL.
  graphql:
    http:
      path: /trips/graphql
    graphiql:
      # Console de developpement, coupee par defaut. GRAPHIQL_ENABLED=true en local.
      enabled: ${GRAPHIQL_ENABLED:false}
      path: /trips/graphiql

  datasource:
    url: ${JDBC_DATABASE_URL:${DATABASE_URL}}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: ${PORT:8082}

