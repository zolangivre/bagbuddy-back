services:
  # --- EUREKA SERVER ---
  eureka-server:
    build:
      context: ./eurekaserver
      dockerfile: Dockerfile
    container_name: eureka-server
    ports:
      - "8761:8761"
    networks:
      - bagbuddy-network

  # --- API GATEWAY ---
  api-gateway:
    build:
      context: ./apigateway
      dockerfile: Dockerfile
    container_name: api-gateway-dev
    ports:
      - "8080:8080"
    depends_on:
      - eureka-server
    restart: always
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - TRIP_SERVICE_URL=http://trip-service:8082
      - TRANSACTION_SERVICE_URL=http://transaction-service:8083
      - REVIEW_SERVICE_URL=http://review-service:8084
      - STRIPE_SERVICE_URL=http://stripe-service:8085
      - USER_SERVICE_URL=http://user-service:8086
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
    networks:
      - bagbuddy-network

  # --- KEYCLOAK ---
  keycloak:
    image: quay.io/keycloak/keycloak:25.0.0
    container_name: keycloak
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_URL_DATABASE: ${KEYCLOAK_DB}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # Substitue dans keycloak/import/bagbuddy-realm.json a l'import du realm :
      # le secret du client de service ne figure plus dans le depot.
      KEYCLOAK_SERVICE_CLIENT_SECRET: ${KEYCLOAK_SERVICE_CLIENT_SECRET}
      KEYCLOAK_ACCOUNTS_CLIENT_SECRET: ${KEYCLOAK_ACCOUNTS_CLIENT_SECRET}
    ports:
      - "8000:8080"
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import
    depends_on:
      - keycloak-db
    networks:
      - bagbuddy-network

  keycloak-db:
    image: postgres:15-alpine
    container_name: keycloak-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB}
      POSTGRES_USER: ${KEYCLOAK_DB_USER}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - keycloak_pgdata:/var/lib/postgresql/data
    ports:
      - 5435:5432
    networks:
      - bagbuddy-network

  # --- USER SERVICE ---
  # Profils applicatifs (bio, localisation, telephone, compte Stripe) et cycle de vie des
  # comptes : le front sert ses propres ecrans d'inscription et de compte, donc ce service
  # relaie les operations que le navigateur ne peut pas porter (creation d'utilisateur,
  # changement d'email, mot de passe) vers l'API d'administration de Keycloak.
  user-service:
    build:
      context: ./userservice
      dockerfile: Dockerfile
    container_name: user-service-dev
    env_file:
      - ./.env
    environment:
      - PORT=8086
      - DATABASE_URL=jdbc:postgresql://userservice-db:5432/${USER_SERVICE_DB}?user=${USER_SERVICE_USER}&password=${USER_SERVICE_PASSWORD}
      - JWT_ISSUER_URIS=http://localhost:8000/realms/bagbuddy,http://keycloak:8080/realms/bagbuddy
      - JWT_JWK_SET_URI=http://keycloak:8080/realms/bagbuddy/protocol/openid-connect/certs
      - JWT_AUDIENCE=bagbuddy-api
      - KEYCLOAK_BASE_URL=http://keycloak:8080
      - KEYCLOAK_REALM=bagbuddy
      - KEYCLOAK_TOKEN_URI=http://keycloak:8080/realms/bagbuddy/protocol/openid-connect/token
      - KEYCLOAK_ACCOUNTS_CLIENT_ID=bagbuddy-accounts
      - KEYCLOAK_ACCOUNTS_CLIENT_SECRET=${KEYCLOAK_ACCOUNTS_CLIENT_SECRET}
      - KEYCLOAK_LOGIN_CLIENT_ID=bagbuddy-web
    ports:
      - "8086:8086"
    depends_on:
      - keycloak
      - userservice-db
    networks:
      - bagbuddy-network

  userservice-db:
    image: postgres:15-alpine
    container_name: user-service-postgres
    environment:
      POSTGRES_DB: ${USER_SERVICE_DB}
      POSTGRES_USER: ${USER_SERVICE_USER}
      POSTGRES_PASSWORD: ${USER_SERVICE_PASSWORD}
    volumes:
      - user_pgdata:/var/lib/postgresql/data
    ports:
      - ${USER_SERVICE_DB_PORT}:5432
    networks:
      - bagbuddy-network

  # --- TRIP SERVICE ---
  trip-service:
    build:
      context: ./tripservice
      dockerfile: Dockerfile
    container_name: trip-service-dev
    env_file:
      - ./.env
    environment:
      - PORT=8082
      - DATABASE_URL=jdbc:postgresql://tripservice-db:5432/${TRIP_SERVICE_DB}?user=${TRIP_SERVICE_USER}&password=${TRIP_SERVICE_PASSWORD}
      - JWT_ISSUER_URIS=http://localhost:8000/realms/bagbuddy,http://keycloak:8080/realms/bagbuddy
      - JWT_JWK_SET_URI=http://keycloak:8080/realms/bagbuddy/protocol/openid-connect/certs
      - JWT_AUDIENCE=bagbuddy-api
    ports:
      - "8082:8082"
    depends_on:
      - eureka-server
      - keycloak
      - tripservice-db
    networks:
      - bagbuddy-network

  tripservice-db:
    image: postgres:15-alpine
    container_name: trip-service-postgres
    environment:
      POSTGRES_DB: ${TRIP_SERVICE_DB}
      POSTGRES_USER: ${TRIP_SERVICE_USER}
      POSTGRES_PASSWORD: ${TRIP_SERVICE_PASSWORD}
    volumes:
      - trip_pgdata:/var/lib/postgresql/data
    ports:
      - ${TRIP_SERVICE_DB_PORT}:5432
    networks:
      - bagbuddy-network

  # --- TRANSACTION SERVICE ---
  transaction-service:
    build:
      context: ./transactionservice
      dockerfile: Dockerfile
    container_name: transaction-service-dev
    env_file:
      - ./.env
    environment:
      - PORT=8083
      - DATABASE_URL=jdbc:postgresql://transactionservice-db:5432/${TRANSACTION_SERVICE_DB}?user=${TRANSACTION_SERVICE_USER}&password=${TRANSACTION_SERVICE_PASSWORD}
      - JWT_ISSUER_URIS=http://localhost:8000/realms/bagbuddy,http://keycloak:8080/realms/bagbuddy
      - JWT_JWK_SET_URI=http://keycloak:8080/realms/bagbuddy/protocol/openid-connect/certs
      - JWT_AUDIENCE=bagbuddy-api
      - KEYCLOAK_TOKEN_URI=http://keycloak:8080/realms/bagbuddy/protocol/openid-connect/token
      - KEYCLOAK_SERVICE_CLIENT_ID=bagbuddy
      - KEYCLOAK_SERVICE_CLIENT_SECRET=${KEYCLOAK_SERVICE_CLIENT_SECRET}
      - TRIP_SERVICE_URL=http://trip-service:8082
      # stripe-service est desactive en dev : le paiement est simule, pas confirme par
      # webhook. A remettre a true (defaut) des que stripe-service tourne.
      - PAYMENTS_REQUIRE_STRIPE=false
    ports:
      - "8083:8083"
    depends_on:
      - eureka-server
      - keycloak
      - transactionservice-db
    networks:
      - bagbuddy-network

  transactionservice-db:
    image: postgres:15-alpine
    container_name: transaction-service-postgres
    environment:
      POSTGRES_DB: ${TRANSACTION_SERVICE_DB}
      POSTGRES_USER: ${TRANSACTION_SERVICE_USER}
      POSTGRES_PASSWORD: ${TRANSACTION_SERVICE_PASSWORD}
    volumes:
      - transaction_pgdata:/var/lib/postgresql/data
    ports:
      - ${TRANSACTION_SERVICE_DB_PORT}:5432
    networks:
      - bagbuddy-network

  # --- REVIEW SERVICE ---
  review-service:
    build:
      context: ./reviewservice
      dockerfile: Dockerfile
    container_name: review-service-dev
    env_file:
      - ./.env
    environment:
      - PORT=8084
      - DATABASE_URL=jdbc:postgresql://reviewservice-db:5432/${REVIEW_SERVICE_DB}?user=${REVIEW_SERVICE_USER}&password=${REVIEW_SERVICE_PASSWORD}
      - JWT_ISSUER_URIS=http://localhost:8000/realms/bagbuddy,http://keycloak:8080/realms/bagbuddy
      - JWT_JWK_SET_URI=http://keycloak:8080/realms/bagbuddy/protocol/openid-connect/certs
      - JWT_AUDIENCE=bagbuddy-api
      - TRANSACTION_SERVICE_URL=http://transaction-service:8083
    ports:
      - "8084:8084"
    depends_on:
      - eureka-server
      - keycloak
      - reviewservice-db
    networks:
      - bagbuddy-network

  reviewservice-db:
    image: postgres:15-alpine
    container_name: review-service-postgres
    environment:
      POSTGRES_DB: ${REVIEW_SERVICE_DB}
      POSTGRES_USER: ${REVIEW_SERVICE_USER}
      POSTGRES_PASSWORD: ${REVIEW_SERVICE_PASSWORD}
    volumes:
      - review_pgdata:/var/lib/postgresql/data
    ports:
      - ${REVIEW_SERVICE_DB_PORT}:5432
    networks:
      - bagbuddy-network

  # Disabled for local dev: requires STRIPE_SECRET_KEY / STRIPE_PUBLISHABLE_KEY / STRIPE_WEBHOOK_SECRET
  # stripe-service:
  #   build:
  #     context: ./stripeservice
  #     dockerfile: Dockerfile
  #   container_name: stripe-service-dev
  #   env_file:
  #     - ./.env
  #   ports:
  #     - "8085:8085"
  #   depends_on:
  #     - keycloak
  #   environment:
  #     PORT: 8085
  #     STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
  #     STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
  #     STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
  #     JWT_ISSUER_URIS: http://localhost:8000/realms/bagbuddy,http://keycloak:8080/realms/bagbuddy
  #     JWT_JWK_SET_URI: http://keycloak:8080/realms/bagbuddy/protocol/openid-connect/certs
  #     JWT_AUDIENCE: bagbuddy-api
  #     KEYCLOAK_TOKEN_URI: http://keycloak:8080/realms/bagbuddy/protocol/openid-connect/token
  #     KEYCLOAK_SERVICE_CLIENT_ID: bagbuddy
  #     KEYCLOAK_SERVICE_CLIENT_SECRET: ${KEYCLOAK_SERVICE_CLIENT_SECRET}
  #     TRANSACTION_SERVICE_URL: http://transaction-service:8083
  #   networks:
  #     - bagbuddy-network

# --- VOLUMES & NETWORK ---
volumes:
  transaction_pgdata:
  keycloak_pgdata:
  review_pgdata:
  trip_pgdata:
  user_pgdata:

networks:
  bagbuddy-network:
    driver: bridge