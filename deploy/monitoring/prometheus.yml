# Scrape de production (profil "monitoring" de docker-compose.prod.yml).
# Chaque JVM expose /actuator/prometheus sur le reseau Docker uniquement ; les noms sont ceux des
# services du compose. Chaque serie porte deja l'etiquette application (management.metrics.tags).
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: bagbuddy
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - api-gateway:8080
          - eureka-server:8761
          - user-service:8086
          - trip-service:8082
          - transaction-service:8083
          - review-service:8084
          - stripe-service:8085
