# Test-only overrides: an in-memory DB and a static auth config so the Spring context
# can start without Postgres or Keycloak being up.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

bagbuddy.auth.issuer-uris=http://localhost:8000/realms/bagbuddy,http://keycloak:8080/realms/bagbuddy
bagbuddy.auth.jwk-set-uri=http://localhost:8000/realms/bagbuddy/protocol/openid-connect/certs
bagbuddy.auth.audience=bagbuddy-api

bagbuddy.transaction-service.url=http://localhost:8083

# Pas de registre pendant les tests : le contexte ne doit pas dependre d'un
# Eureka joignable, et sans cela chaque test passerait son temps a retenter
# localhost:8761.
eureka.client.enabled=false

# Les migrations sont ecrites pour PostgreSQL ; les tests tournent sur H2 et
# laissent Hibernate creer le schema (ddl-auto=create-drop ci-dessus). Les
# migrations reelles sont exercees par les tests Testcontainers.
spring.flyway.enabled=false

# Aucun collecteur de traces pendant les tests.
management.tracing.enabled=false
