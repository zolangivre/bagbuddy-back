spring:
  application:
    name: review-service

  # --- GraphQL ---
  # Le point d'entree porte le prefixe du service : l'apigateway continue de router par prefixe
  # de chemin (Path=/reviews/**) sans reecriture, et un appel direct au conteneur emprunte
  # exactement la meme URL. Une seule route, un seul POST : c'est le contrat GraphQL.
  graphql:
    http:
      path: /reviews/graphql
    graphiql:
      # Console de developpement, coupee par defaut. GRAPHIQL_ENABLED=true en local.
      enabled: ${GRAPHIQL_ENABLED:false}
      path: /reviews/graphiql

  datasource:
    url: ${JDBC_DATABASE_URL:${DATABASE_URL}}
    driver-class-name: org.postgresql.Driver

  flyway:
    # Les bases de dev existantes ont ete creees par Hibernate et n'ont pas
    # d'historique Flyway : on les marque au niveau V1 (deja en place) au lieu
    # d'echouer, et seules les migrations suivantes leur sont appliquees.
    baseline-on-migrate: true
    baseline-version: 1

  jpa:
    hibernate:
      # Le schema appartient a Flyway. 'validate' echoue au demarrage si les
      # entites et les migrations ont diverge -- c'est le but : mieux vaut ne pas
      # demarrer que decouvrir la divergence sur une requete en production.
      ddl-auto: validate
    show-sql: false
    # Une requete HTTP ne doit pas retenir une connexion DB pendant la serialisation GraphQL.
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: ${PORT:8084}

# --- Service discovery (Eureka) ---
# Le service s'enregistre sous son spring.application.name : c'est ce nom que
# l'apigateway resout (lb://review-service). Le port annonce est deduit de
# server.port, il n'y a donc rien a coder en dur ici.
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
    # Cadence dev : un service redemarre doit redevenir routable en quelques
    # secondes, pas au bout d'une minute et demie.
    registry-fetch-interval-seconds: 5
  instance:
    # En Docker, le nom d'hote d'un conteneur n'est resolvable que depuis le
    # reseau compose ; son IP l'est toujours.
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15

logging:
  level:
    # Trace SQL a la demande : SQL_LOG_LEVEL=debug en local si besoin.
    org.hibernate.SQL: ${SQL_LOG_LEVEL:warn}
    org.springframework: info

# --- Authentification (Keycloak) ---
# issuer-uri = ce que le token contient (URL publique de Keycloak, cote navigateur)
# jwk-set-uri = comment CE service joint Keycloak (nom de conteneur en Docker)
bagbuddy:
  auth:
    # Liste blanche : meme realm, deux noms d'hote (navigateur / reseau Docker).
    issuer-uris: ${JWT_ISSUER_URIS:http://localhost:8000/realms/bagbuddy,http://keycloak:8080/realms/bagbuddy}
    jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8000/realms/bagbuddy/protocol/openid-connect/certs}
    audience: ${JWT_AUDIENCE:bagbuddy-api}

bagbuddy.transaction-service.url: ${TRANSACTION_SERVICE_URL:http://localhost:8083}

management:
  tracing:
    sampling:
      # Dev : on trace tout. En production ce taux se baisse, le cout d'un span
      # n'est pas nul.
      probability: ${TRACING_SAMPLE_RATE:1.0}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # Anonyme : uniquement UP/DOWN, ce dont la sonde Docker a besoin.
      # Authentifie : le detail (base, disque, registre). L'endpoint est ouvert
      # dans SecurityConfig, il ne doit donc pas raconter l'infra a un inconnu.
      show-details: when-authorized
      probes:
        enabled: true

# --- Appels sortants ---
# Delais courts et explicites : sans eux, un service muet fait patienter le
# client jusqu'au timeout par defaut de la couche HTTP.
spring.http.client:
  connect-timeout: 2s
  read-timeout: 5s

resilience4j:
  circuitbreaker:
    instances:
      transactionservice:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        # Un 404 ou un refus d'acces sont des reponses, pas des pannes : les
        # compter ouvrirait le circuit parce que des clients demandent des
        # choses qui n'existent pas.
        ignore-exceptions:
          - java.util.NoSuchElementException
          - java.lang.IllegalArgumentException
          - org.springframework.security.access.AccessDeniedException
