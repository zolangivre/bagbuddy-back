spring:
  application:
    name: api-gateway

  # Compteurs de RequestRateLimiter (route /users/**). Le gateway ne demarre pas
  # sans Redis des lors qu'une route est limitee.
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cloud:
    loadbalancer:
      cache:
        # Sans cela le gateway garde sa vue des instances 35 secondes, ce qui
        # annulerait en pratique la cadence reglee cote Eureka.
        ttl: 5s

    gateway:
      # Chaque service expose son propre schema GraphQL sous son prefixe
      # (/trips/graphql, /transactions/graphql, ...). Les routes restent donc de
      # simples predicats de chemin, sans reecriture : c'est pour cela que les
      # services configurent spring.graphql.http.path avec leur prefixe plutot
      # que le /graphql par defaut.
      #
      # Restent en REST derriere ces memes routes : les endpoints /internal
      # service-a-service et le webhook Stripe, que GraphQL ne sert pas.
      #
      # Les cibles sont des lb://<spring.application.name> resolus par Eureka :
      # le gateway ne connait plus aucune URL de service. Consequence a
      # connaitre -- un service non enregistre donne un 503 et non un refus de
      # connexion, et il faut quelques secondes apres son demarrage pour qu'il
      # apparaisse dans le registre.
      routes:
        - id: trip-service
          uri: lb://trip-service
          predicates:
            - Path=/trips/**

        - id: transaction-service
          uri: lb://transaction-service
          predicates:
            - Path=/transactions/**

        - id: review-service
          uri: lb://review-service
          predicates:
            - Path=/reviews/**

        - id: stripe-service
          uri: lb://stripe-service
          predicates:
            - Path=/stripe/**

        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/users/**
          # Seule route portant une operation anonyme (register), et cette
          # operation declenche des appels a l'API d'administration de Keycloak :
          # c'est la qu'une limite par IP a le plus de valeur. Les autres routes
          # exigent un jeton, ce qui limite deja la casse.
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: ${RATE_LIMIT_PER_SECOND:10}
                redis-rate-limiter.burstCapacity: ${RATE_LIMIT_BURST:20}
                key-resolver: "#{@clientIpKeyResolver}"

      globalcors:
        cors-configurations:
          "[/**]":
            allowedOriginPatterns: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600

      httpclient:
        connect-timeout: 5000
        response-timeout: 20000
        pool:
          max-connections: 50

# --- Service discovery (Eureka) ---
# Le gateway est client du registre : il s'y enregistre (pratique pour le voir
# dans le dashboard) et surtout il le lit pour resoudre les lb:// ci-dessus.
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15

server:
  port: ${PORT:8080}

management:
  tracing:
    sampling:
      # Dev : on trace tout. En production ce taux se baisse, le cout d'un span
      # n'est pas nul.
      probability: ${TRACING_SAMPLE_RATE:1.0}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # Le gateway n'a aucune securite devant lui : 'always' publierait l'etat
      # de l'infra a qui sait joindre le port.
      show-details: when-authorized
      probes:
        enabled: true

logging:
  level:
    "[org.springframework.cloud.gateway]": INFO
    root: INFO