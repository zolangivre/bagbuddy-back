spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      # Chaque service expose son propre schema GraphQL sous son prefixe
      # (/trips/graphql, /transactions/graphql, ...). Les routes restent donc de
      # simples predicats de chemin, sans reecriture : c'est pour cela que les
      # services configurent spring.graphql.http.path avec leur prefixe plutot
      # que le /graphql par defaut.
      #
      # Restent en REST derriere ces memes routes : les endpoints /internal
      # service-a-service et le webhook Stripe, que GraphQL ne sert pas.
      routes:
        - id: trip-service
          uri: ${TRIP_SERVICE_URL}
          predicates:
            - Path=/trips/**

        - id: transaction-service
          uri: ${TRANSACTION_SERVICE_URL}
          predicates:
            - Path=/transactions/**

        - id: review-service
          uri: ${REVIEW_SERVICE_URL}
          predicates:
            - Path=/reviews/**

        - id: stripe-service
          uri: ${STRIPE_SERVICE_URL}
          predicates:
            - Path=/stripe/**

        - id: user-service
          uri: ${USER_SERVICE_URL}
          predicates:
            - Path=/users/**

      globalcors:
        cors-configurations:
          "[/**]":
            allowedOriginPatterns: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600

      httpclient:
        connect-timeout: 5000
        response-timeout: 20000
        pool:
          max-connections: 50

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

logging:
  level:
    "[org.springframework.cloud.gateway]": INFO
    root: INFO