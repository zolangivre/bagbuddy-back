# Les routes ciblent des lb://<service> resolus par Eureka : le contexte n'a
# plus besoin qu'on lui fournisse une URL par service. Le registre, lui, est
# coupe -- un test de chargement de contexte ne doit pas exiger un Eureka debout.
eureka.client.enabled=false

# Aucun collecteur de traces pendant les tests.
management.tracing.enabled=false
