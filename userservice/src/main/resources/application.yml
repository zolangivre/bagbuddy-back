spring:
  application:
    name: user-service

  datasource:
    url: ${JDBC_DATABASE_URL:${DATABASE_URL}}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: ${PORT:8086}

# --- Authentification (Keycloak) ---
# Ce service ne parle plus a l'API d'administration de Keycloak : il ne detient aucun
# secret, il se contente de valider le jeton de l'appelant et de porter le profil applicatif.
bagbuddy:
  auth:
    # Liste blanche : meme realm, deux noms d'hote (navigateur / reseau Docker).
    issuer-uris: ${JWT_ISSUER_URIS:http://localhost:8000/realms/bagbuddy,http://keycloak:8080/realms/bagbuddy}
    jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8000/realms/bagbuddy/protocol/openid-connect/certs}
    audience: ${JWT_AUDIENCE:bagbuddy-api}

logging:
  level:
    com.bagbuddy.userservice: INFO
